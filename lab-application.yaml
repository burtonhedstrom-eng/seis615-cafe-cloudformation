AWSTemplateFormatVersion: 2010-09-09
# CHANGED: description now reflects the highly available cafe-app application stack.
Description: >-
  Application Template: Rebuilds the cafe-app from the "Elasticity and
  availability" assignment. Imports the VPC and subnets from the network stack
  and provisions a bastion host, the 7 /cafe/* Secrets Manager secrets, a
  Multi-AZ MariaDB RDS instance, an app IAM role/instance profile, a launch
  template, an internet-facing Application Load Balancer and an Auto Scaling
  group running the cafe-app.

# CHANGE LOG
# ---------------------------------------------------------------------------
# CHANGED: Description rewritten for the highly available cafe-app application stack.
# CHANGED: NetworkStackName parameter kept (lab default); it still drives the Fn::ImportValue lookups.
# REMOVED: AmazonLinuxAMIID (amzn2) parameter; replaced by LatestAmiId (Amazon Linux 2023 SSM).
# ADDED:   Parameters MyIP, KeyName, LatestAmiId, InstanceType, AsgMinSize, AsgMaxSize,
#          AsgDesiredCapacity, CpuTargetValue, DBInstanceClass, DBAllocatedStorage,
#          DBEngineVersion, DBMultiAZ, DBMasterUsername, AppRepoUrl, HealthCheckPath.
# ADDED:   Metadata AWS::CloudFormation::Interface to group/label the console form.
# ADDED:   Condition IsDBMultiAZ driving the RDS MultiAZ property from the DBMultiAZ parameter.
# ADDED:   Security groups BastionSG (22 from MyIP), AlbSG (80 from 0.0.0.0/0),
#          AppSG (80 from AlbSG, 22 from BastionSG), DBSG (3306 from AppSG only).
# ADDED:   BastionHost (Amazon Linux 2023) in public subnet 1 for SSH checks.
# CHANGED: BastionHost uses top-level SubnetId/SecurityGroupIds (not a NetworkInterfaces
#          block) so !GetAtt BastionHost.PublicIp populates the BastionPublicIP output.
# ADDED:   Seven /cafe/* Secrets Manager secrets; dbPassword generated (plain string,
#          excluding / @ " ' \ and spaces); dbUrl holds the RDS endpoint.
# ADDED:   DBSubnetGroup (both private subnets) + Multi-AZ MariaDB 10.6.25 RDS instance
#          (db.t3.micro, gp2 20 GiB, not public) using the dbPassword via a dynamic reference;
#          DeletionPolicy/UpdateReplacePolicy Delete.
# ADDED:   AppInstanceRole + AppInstanceProfile with least-privilege read of the /cafe/* secrets
#          plus AmazonSSMManagedInstanceCore.
# CHANGED: Single WebServerInstance replaced by a LaunchTemplate (cfn-init metadata + user data
#          following the lab cfn-init/cfn-signal pattern) that deploys the cafe-app, patches
#          serverInfo.php, loads cafe_db idempotently (GET_LOCK) and signals the ASG.
# REMOVED: WebServerInstance (single EC2 instance) — the Auto Scaling group replaces it.
# REMOVED: DiskVolume (100 GiB EBS volume) — not needed by the stateless app tier.
# REMOVED: DiskMountPoint (volume attachment) — removed with DiskVolume.
# CHANGED: WebServerSecurityGroup (80 from 0.0.0.0/0) replaced by the four scoped SGs above.
# ADDED:   TargetGroup (HTTP 80, health check HealthCheckPath, success 200),
#          internet-facing ApplicationLoadBalancer in both public subnets, HTTP:80 Listener.
# ADDED:   AutoScalingGroup in both private subnets (ELB health checks, CreationPolicy of one
#          signal per desired instance, AutoScalingRollingUpdate UpdatePolicy) and a
#          target-tracking policy on ASGAverageCPUUtilization.
# CHANGED: Output URL now points at the load balancer DNS name instead of a single instance.
# ADDED:   Outputs BastionPublicIP, DBEndpoint, AutoScalingGroupName, TargetGroupArn.
# CHANGED: cfn-init yum packages php/php-mysqlnd -> php8.1/php8.1-mysqlnd (the bare
#          names do not exist on Amazon Linux 2023; first deploy failed cfn-init).
# CHANGED: deploy script now unzips db.zip before loading create-db.sql (the repo
#          ships the DB loader zipped; without this the DB load found no sql file).
# ---------------------------------------------------------------------------

# This template creates:
#   Four security groups (bastion, ALB, app, DB)
#   Bastion host (Amazon Linux 2023)
#   Seven /cafe/* Secrets Manager secrets (dbPassword generated)
#   Multi-AZ MariaDB RDS instance in a DB subnet group of both private subnets
#   App IAM role + instance profile (least-privilege secret read)
#   Launch template (cfn-init + cfn-signal cafe-app bootstrap)
#   Target group, internet-facing Application Load Balancer, HTTP listener
#   Auto Scaling group with a CPU target-tracking policy

######################
# Parameters section
######################

Parameters:

  NetworkStackName:
    Description: >-
      Name of an active CloudFormation stack that contains the networking
      resources, such as the VPC and subnets that will be used in this stack.
    Type: String
    MinLength: 1
    MaxLength: 255
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]*$'
    Default: lab-network

  # ADDED: source CIDR allowed to SSH to the bastion (never 0.0.0.0/0).
  MyIP:
    Description: Your public IP as a /32 CIDR, allowed to SSH to the bastion host.
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/32$
    ConstraintDescription: Must be a single-address CIDR, e.g. 203.0.113.10/32.

  # ADDED: EC2 key pair for the bastion and app instances.
  KeyName:
    Description: Name of an existing EC2 key pair for SSH access.
    Type: AWS::EC2::KeyPair::KeyName
    Default: cafe-cfn-key

  # REMOVED: AmazonLinuxAMIID (amzn2 SSM parameter) — replaced by LatestAmiId below.
  # ADDED: Amazon Linux 2023 AMI resolved from SSM Parameter Store.
  LatestAmiId:
    Description: Amazon Linux 2023 AMI ID (resolved from SSM Parameter Store).
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  # ADDED: instance type for the bastion and app instances.
  InstanceType:
    Description: EC2 instance type for the bastion and app instances.
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

  # ADDED: Auto Scaling group sizing.
  AsgMinSize:
    Description: Minimum number of app instances.
    Type: Number
    Default: 2
    MinValue: 1

  AsgMaxSize:
    Description: Maximum number of app instances.
    Type: Number
    Default: 4
    MinValue: 1

  AsgDesiredCapacity:
    Description: Desired number of app instances at launch.
    Type: Number
    Default: 2
    MinValue: 1

  # ADDED: target CPU utilisation for the scaling policy.
  CpuTargetValue:
    Description: Target average CPU utilisation (percent) for the scaling policy.
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 90

  # ADDED: RDS instance class.
  DBInstanceClass:
    Description: RDS instance class.
    Type: String
    Default: db.t3.micro

  # ADDED: RDS allocated storage in GiB.
  DBAllocatedStorage:
    Description: RDS allocated storage in GiB.
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100

  # ADDED: RDS MariaDB engine version.
  DBEngineVersion:
    Description: MariaDB engine version.
    Type: String
    Default: 10.6.25

  # ADDED: whether RDS is Multi-AZ (consumed through the IsDBMultiAZ condition).
  DBMultiAZ:
    Description: Deploy RDS as Multi-AZ.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  # ADDED: RDS master username (the password is generated, never a parameter).
  DBMasterUsername:
    Description: RDS master username (used as /cafe/dbUser).
    Type: String
    Default: admin
    AllowedPattern: ^[a-zA-Z][a-zA-Z0-9]*$
    MinLength: 1
    MaxLength: 16

  # ADDED: Git repository the cafe-app is cloned from at boot.
  AppRepoUrl:
    Description: HTTPS URL of the cafe-app Git repository.
    Type: String
    Default: https://github.com/rclc/cafe-app.git

  # ADDED: load balancer / target group health check path.
  HealthCheckPath:
    Description: HTTP path the target group health check requests.
    Type: String
    Default: /cafe/

######################
# Metadata section
######################

# ADDED: console form grouping and labels.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network
        Parameters:
          - NetworkStackName
          - MyIP
      - Label:
          default: Compute
        Parameters:
          - KeyName
          - LatestAmiId
          - InstanceType
          - AppRepoUrl
          - HealthCheckPath
      - Label:
          default: Auto Scaling
        Parameters:
          - AsgMinSize
          - AsgMaxSize
          - AsgDesiredCapacity
          - CpuTargetValue
      - Label:
          default: Database
        Parameters:
          - DBInstanceClass
          - DBAllocatedStorage
          - DBEngineVersion
          - DBMultiAZ
          - DBMasterUsername
    ParameterLabels:
      NetworkStackName:
        default: Network stack name
      MyIP:
        default: Your IP (/32 CIDR) for bastion SSH
      KeyName:
        default: EC2 key pair
      LatestAmiId:
        default: Amazon Linux 2023 AMI (SSM)
      InstanceType:
        default: Instance type
      AppRepoUrl:
        default: cafe-app Git repository URL
      HealthCheckPath:
        default: Health check path
      AsgMinSize:
        default: ASG minimum size
      AsgMaxSize:
        default: ASG maximum size
      AsgDesiredCapacity:
        default: ASG desired capacity
      CpuTargetValue:
        default: Target CPU utilisation (%)
      DBInstanceClass:
        default: RDS instance class
      DBAllocatedStorage:
        default: RDS storage (GiB)
      DBEngineVersion:
        default: MariaDB engine version
      DBMultiAZ:
        default: RDS Multi-AZ
      DBMasterUsername:
        default: RDS master username

######################
# Conditions section
######################

# ADDED: drives the RDS MultiAZ property from the DBMultiAZ parameter.
Conditions:
  IsDBMultiAZ: !Equals [!Ref DBMultiAZ, 'true']

######################
# Resources section
######################

Resources:

  ## Security groups

  # ADDED: bastion SG — SSH only from the MyIP parameter (never 0.0.0.0/0).
  BastionSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Bastion host - SSH from MyIP only
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
          Description: SSH from MyIP
      Tags:
        - Key: Name
          Value: cafe-cfn-bastion-sg
        - Key: Project
          Value: cafe-cfn

  # ADDED: ALB SG — HTTP 80 from anywhere (public entry point).
  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application Load Balancer - HTTP from anywhere
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from anywhere
      Tags:
        - Key: Name
          Value: cafe-cfn-alb-sg
        - Key: Project
          Value: cafe-cfn

  # CHANGED: the lab WebServerSecurityGroup (80 from 0.0.0.0/0) becomes the app SG —
  #          HTTP 80 only from the ALB SG, SSH 22 only from the bastion SG.
  AppSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App instances - HTTP from ALB, SSH from bastion
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSG
          Description: HTTP from the ALB
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref BastionSG
          Description: SSH from the bastion
      Tags:
        - Key: Name
          Value: cafe-cfn-app-sg
        - Key: Project
          Value: cafe-cfn

  # ADDED: DB SG — MySQL/MariaDB 3306 only from the app SG (never public).
  DBSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS - MySQL/MariaDB from app instances only
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSG
          Description: MariaDB from the app instances
      Tags:
        - Key: Name
          Value: cafe-cfn-db-sg
        - Key: Project
          Value: cafe-cfn

  ## Bastion host

  # ADDED: bastion host in public subnet 1, used only for SSH checks.
  # CHANGED: use top-level SubnetId/SecurityGroupIds instead of a NetworkInterfaces
  #          block so that !GetAtt BastionHost.PublicIp populates the BastionPublicIP
  #          output reliably (public subnet 1 auto-assigns a public IPv4).
  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      SubnetId:
        Fn::ImportValue: !Sub ${NetworkStackName}-PublicSubnet1ID
      SecurityGroupIds:
        - !Ref BastionSG
      Tags:
        - Key: Name
          Value: cafe-cfn-bastion
        - Key: Project
          Value: cafe-cfn

  ## Secrets Manager secrets (the 7 /cafe/* settings the cafe-app reads)

  # ADDED: non-sensitive flag that controls the Server Information panel.
  ShowServerInfoSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/showServerInfo
      Description: cafe-app showServerInfo flag
      SecretString: 'true'
      Tags:
        - Key: Project
          Value: cafe-cfn

  # ADDED: application time zone.
  TimeZoneSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/timeZone
      Description: cafe-app time zone
      SecretString: America/New_York
      Tags:
        - Key: Project
          Value: cafe-cfn

  # ADDED: display currency symbol.
  CurrencySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/currency
      Description: cafe-app currency symbol
      SecretString: $
      Tags:
        - Key: Project
          Value: cafe-cfn

  # ADDED: database name.
  DBNameSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/dbName
      Description: cafe-app database name
      SecretString: cafe_db
      Tags:
        - Key: Project
          Value: cafe-cfn

  # ADDED: database user (the RDS master username).
  DBUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/dbUser
      Description: cafe-app database user
      SecretString: !Ref DBMasterUsername
      Tags:
        - Key: Project
          Value: cafe-cfn

  # ADDED: database password GENERATED by Secrets Manager as a plain string,
  #        excluding / @ " ' \ and spaces. RDS reads it via a dynamic reference;
  #        it is never a parameter and never stored in the repo.
  DBPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/dbPassword
      Description: cafe-app database password (generated)
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: false
        ExcludeCharacters: '/@"''\ '
        IncludeSpace: false
      Tags:
        - Key: Project
          Value: cafe-cfn

  # ADDED: database endpoint (host). Set from the RDS instance address so the
  #        app reads /cafe/dbUrl just like the lab's Parameter Store value.
  DBUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/dbUrl
      Description: cafe-app database endpoint
      SecretString: !GetAtt DBInstance.Endpoint.Address
      Tags:
        - Key: Project
          Value: cafe-cfn

  ## RDS (MariaDB, Multi-AZ, private)

  # ADDED: DB subnet group spanning both private subnets.
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: cafe-cfn private DB subnet group
      SubnetIds:
        - Fn::ImportValue: !Sub ${NetworkStackName}-PrivateSubnet1ID
        - Fn::ImportValue: !Sub ${NetworkStackName}-PrivateSubnet2ID
      Tags:
        - Key: Name
          Value: cafe-cfn-db-subnet-group
        - Key: Project
          Value: cafe-cfn

  # ADDED: Multi-AZ MariaDB instance, not publicly accessible, password from the
  #        generated secret via a dynamic reference. Delete on stack delete/replace.
  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: mariadb
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp2
      MultiAZ: !If [IsDBMultiAZ, true, false]
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSG
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBPasswordSecret}:SecretString}}'
      BackupRetentionPeriod: 0
      Tags:
        - Key: Name
          Value: cafe-cfn-db
        - Key: Project
          Value: cafe-cfn

  ## IAM role + instance profile for the app instances

  # ADDED: least-privilege role — read only the /cafe/* secrets + SSM core.
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: cafe-read-secrets
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # getAppParameters.php only calls GetSecretValue on the 7 /cafe/* secrets.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref ShowServerInfoSecret
                  - !Ref TimeZoneSecret
                  - !Ref CurrencySecret
                  - !Ref DBNameSecret
                  - !Ref DBUserSecret
                  - !Ref DBPasswordSecret
                  - !Ref DBUrlSecret
      Tags:
        - Key: Project
          Value: cafe-cfn

  # ADDED: instance profile wrapping the role (no fixed name -> CAPABILITY_IAM).
  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppInstanceRole

  ## Launch template (cfn-init + cfn-signal cafe-app bootstrap)

  # CHANGED: the lab's single WebServerInstance is replaced by this launch template.
  #          It keeps the lab's cfn-init/cfn-signal pattern but deploys the cafe-app,
  #          patches serverInfo.php, loads cafe_db idempotently and signals the ASG.
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          All:
            - InstallPackages
            - DeployApp
        InstallPackages:
          packages:
            yum:
              httpd: []
              # CHANGED: Amazon Linux 2023 has no bare "php"/"php-mysqlnd" packages
              #          (cfn-init failed: "Yum does not have php-mysqlnd available");
              #          AL2023 ships PHP as versioned packages, so use php8.1 and
              #          php8.1-mysqlnd (provides mysqlnd/pdo_mysql, php.ini at /etc/php.ini).
              php8.1: []
              php8.1-mysqlnd: []
              mariadb105: []
              git: []
          services:
            sysvinit:
              httpd:
                enabled: true
                ensureRunning: true
        DeployApp:
          files:
            # Bootstrap script: deploy the app, patch serverInfo.php, load the DB.
            /opt/cafe/deploy-app.sh:
              mode: '000755'
              owner: root
              group: root
              content: !Sub |
                #!/bin/bash
                set -euo pipefail
                LOG=/var/log/cafe-bootstrap.log
                exec >>"$LOG" 2>&1
                echo "=== cafe-app bootstrap $(date -u) ==="

                export AWS_DEFAULT_REGION=${AWS::Region}

                # --- Read the settings the loader needs from Secrets Manager.
                # The password is read into a variable only; it is never logged.
                echo "Reading /cafe/* secrets"
                DB_HOST=$(aws secretsmanager get-secret-value --secret-id /cafe/dbUrl --query SecretString --output text)
                DB_NAME=$(aws secretsmanager get-secret-value --secret-id /cafe/dbName --query SecretString --output text)
                DB_USER=$(aws secretsmanager get-secret-value --secret-id /cafe/dbUser --query SecretString --output text)
                DB_PASS=$(aws secretsmanager get-secret-value --secret-id /cafe/dbPassword --query SecretString --output text)
                echo "DB host=$DB_HOST db=$DB_NAME user=$DB_USER password=***"

                # --- Deploy the cafe-app source.
                echo "Cloning ${AppRepoUrl}"
                rm -rf /tmp/cafe-src
                git clone --depth 1 ${AppRepoUrl} /tmp/cafe-src
                cd /tmp/cafe-src

                echo "Unzipping cafe.zip into /var/www/html"
                unzip -o cafe.zip -d /var/www/html

                # CHANGED: unzip db.zip so db/sql/create-db.sql exists (the repo ships
                #          the DB loader zipped; the first deploy's load step failed with
                #          "create-db.sql: No such file or directory").
                echo "Unzipping db.zip (DB loader + sql/create-db.sql)"
                unzip -o db.zip -d /tmp/cafe-src

                echo "Placing AWS PHP SDK in the cafe folder"
                cp aws.zip aws.phar /var/www/html/cafe/
                unzip -o /var/www/html/cafe/aws.zip -d /var/www/html/cafe/
                chmod -R +r /var/www/html/cafe

                # --- Patch serverInfo.php for instances behind the ALB (no public IP).
                echo "Patching serverInfo.php"
                sed -i \
                  -e 's#meta-data/placement/public-ipv4#meta-data/local-ipv4#g' \
                  -e 's#meta-data/placement/instance-id#meta-data/instance-id#g' \
                  /var/www/html/cafe/serverInfo.php

                # --- PHP time zone.
                echo "Setting php.ini time zone"
                if ! grep -q '^date.timezone' /etc/php.ini; then
                  sed -i '2i date.timezone = "America/New_York"' /etc/php.ini
                fi

                # --- Load cafe_db into RDS, idempotent and concurrency-safe.
                # create-db.sql runs DROP DATABASE / CREATE DATABASE unconditionally,
                # so two instances must never run it concurrently, nor re-run it after
                # a successful load. Everything happens in ONE mysql session that holds
                # a MariaDB named lock (GET_LOCK) for the whole operation:
                #   1. GET_LOCK blocks until this instance's turn (serialises instances).
                #   2. A guard checks cafe_db.product; if it already exists it SIGNALs an
                #      error, which (mysql stops on first error by default) aborts the
                #      session before the destructive create script runs.
                #   3. Otherwise the create script runs, then the lock is released.
                echo "Loading cafe_db if needed"
                MYSQL="mysql --connect-timeout=15 -h $DB_HOST -u $DB_USER -p$DB_PASS"
                # Wait for RDS to accept connections.
                for i in $(seq 1 30); do
                  if $MYSQL -e 'SELECT 1' >/dev/null 2>&1; then break; fi
                  echo "waiting for RDS ($i)"; sleep 10
                done
                LOAD_RC=0
                {
                  echo "SELECT GET_LOCK('cafe_db_load', 300);"
                  # Ensure a schema exists to hold the guard routine (create-db.sql
                  # later drops and recreates cafe_db, so this is throwaway).
                  echo "CREATE DATABASE IF NOT EXISTS cafe_db;"
                  echo "DROP PROCEDURE IF EXISTS cafe_db.cafe_guard;"
                  echo "DELIMITER //"
                  echo "CREATE PROCEDURE cafe_db.cafe_guard() BEGIN"
                  echo "  IF (SELECT COUNT(*) FROM information_schema.tables"
                  echo "      WHERE table_schema='cafe_db' AND table_name='product') > 0 THEN"
                  echo "    SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='cafe_db already loaded';"
                  echo "  END IF;"
                  echo "END //"
                  echo "DELIMITER ;"
                  # If product exists this SIGNALs an error; mysql stops before the
                  # destructive create script (no --force), so the load is skipped.
                  echo "CALL cafe_db.cafe_guard();"
                  echo "DROP PROCEDURE IF EXISTS cafe_db.cafe_guard;"
                  cat /tmp/cafe-src/db/sql/create-db.sql
                  echo "SELECT RELEASE_LOCK('cafe_db_load');"
                } | $MYSQL || LOAD_RC=$?
                if [ "$LOAD_RC" -ne 0 ]; then
                  # Non-zero means the guard tripped (already loaded) or a real error.
                  echo "load session exited $LOAD_RC (already loaded, or error)"
                fi
                # Final guard: the table must exist now, regardless of which instance loaded it.
                $MYSQL -e "SELECT COUNT(*) FROM cafe_db.product" >/dev/null

                echo "Restarting httpd"
                systemctl restart httpd
                echo "=== cafe-app bootstrap complete $(date -u) ==="
          commands:
            01-deploy:
              command: /opt/cafe/deploy-app.sh
    Properties:
      LaunchTemplateName: cafe-cfn-app-lt
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: !Ref LatestAmiId
        KeyName: !Ref KeyName
        # ADDED: detailed (1-minute) monitoring for the scaling policy.
        Monitoring:
          Enabled: true
        IamInstanceProfile:
          Arn: !GetAtt AppInstanceProfile.Arn
        # ADDED: app SG only; no subnet here (the ASG places instances in private subnets).
        SecurityGroupIds:
          - !Ref AppSG
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: cafe-cfn-app
              - Key: Project
                Value: cafe-cfn
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            dnf install -y aws-cfn-bootstrap
            # Install packages and run the deploy script from the metadata.
            /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource AppLaunchTemplate --configsets All --region ${AWS::Region}
            # Signal the result to the Auto Scaling group.
            /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource AppAutoScalingGroup --region ${AWS::Region}

  ## Load balancer

  # REMOVED: WebServerInstance (the lab's single EC2 web server) lived here —
  #          the AppLaunchTemplate + AppAutoScalingGroup replace it.
  # REMOVED: DiskVolume (the lab's 100 GiB EBS volume) lived here — the
  #          stateless app tier does not need it.
  # REMOVED: DiskMountPoint (the lab's volume attachment) lived here — removed
  #          with DiskVolume.

  # ADDED: target group (HTTP 80, health check HealthCheckPath, success 200).
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VPCID
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Name
          Value: cafe-cfn-tg
        - Key: Project
          Value: cafe-cfn

  # ADDED: internet-facing ALB spanning both public subnets.
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSG
      Subnets:
        - Fn::ImportValue: !Sub ${NetworkStackName}-PublicSubnet1ID
        - Fn::ImportValue: !Sub ${NetworkStackName}-PublicSubnet2ID
      Tags:
        - Key: Name
          Value: cafe-cfn-alb
        - Key: Project
          Value: cafe-cfn

  # ADDED: HTTP:80 listener forwarding to the target group.
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ## Auto Scaling group

  # ADDED: ASG in both private subnets with ELB health checks. CreationPolicy
  #        waits for one signal per desired instance; rolling update on changes.
  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy:
      ResourceSignal:
        Count: !Ref AsgDesiredCapacity
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT15M
        WaitOnResourceSignals: true
    Properties:
      VPCZoneIdentifier:
        - Fn::ImportValue: !Sub ${NetworkStackName}-PrivateSubnet1ID
        - Fn::ImportValue: !Sub ${NetworkStackName}-PrivateSubnet2ID
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DesiredCapacity: !Ref AsgDesiredCapacity
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      TargetGroupARNs:
        - !Ref TargetGroup
      Tags:
        - Key: Name
          Value: cafe-cfn-app
          PropagateAtLaunch: true
        - Key: Project
          Value: cafe-cfn
          PropagateAtLaunch: true

  # ADDED: target-tracking policy on average ASG CPU utilisation.
  CpuTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTargetValue

######################
# Outputs section
######################

Outputs:

  # CHANGED: URL now points at the load balancer DNS name, not a single instance.
  URL:
    Description: URL of the cafe-app on the load balancer
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/cafe/'

  # ADDED: bastion public IP for SSH checks.
  BastionPublicIP:
    Description: Public IP of the bastion host
    Value: !GetAtt BastionHost.PublicIp

  # ADDED: RDS endpoint address.
  DBEndpoint:
    Description: RDS instance endpoint address
    Value: !GetAtt DBInstance.Endpoint.Address

  # ADDED: Auto Scaling group name.
  AutoScalingGroupName:
    Description: Name of the Auto Scaling group
    Value: !Ref AppAutoScalingGroup

  # ADDED: target group ARN.
  TargetGroupArn:
    Description: ARN of the target group
    Value: !Ref TargetGroup
